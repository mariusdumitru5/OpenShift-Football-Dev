# Deployment-backend -> Pod-backend (python-app + Secret-db + ConfigMap-backend). 1 replica: la coda partite e i match sono in memoria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
  annotations:
    # Quando la BuildConfig pubblica una nuova immagine su backend:latest,
    # OpenShift aggiorna questo campo e il Deployment fa rollout da solo.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]
spec:
  replicas: 1
  strategy:
    type: Recreate   # mai due istanze con code partite diverse
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest          # risolto tramite ImageStream (lookupPolicy local)
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-backend   # ConfigMap-backend (nome con hash aggiunto da Kustomize)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-db      # Secret-db
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
