# Le ImageStream ricevono le immagini prodotte dalle BuildConfig.
# lookupPolicy.local=true permette ai Deployment di usare "nome:latest" come immagine.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: frontend
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: auth
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: backend
spec:
  lookupPolicy:
    local: true
