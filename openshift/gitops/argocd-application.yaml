# OPZIONALE: automazione totale con OpenShift GitOps (Argo CD).
# Argo CD osserva la repo e applica da solo "oc apply -k overlays/dev" a ogni push:
# modifiche a ConfigMap, Secret, StatefulSet, Deployment... arrivano nel cluster
# senza lanciare nessun comando.
#
#   oc apply -f openshift/gitops/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: football
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/TUO-UTENTE/football-openshift.git
    targetRevision: main
    path: openshift/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: football
  syncPolicy:
    automated:
      prune: true        # se togli una risorsa dalla repo, sparisce dal cluster
      selfHeal: true     # se qualcuno la modifica a mano, viene riportata come in Git
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops   # permessi per Argo CD
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # Il campo image dei Deployment viene aggiornato dai trigger delle ImageStream
  # dopo ogni build: Argo CD non deve riportarlo a "nome:latest".
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].image
