# Overlay "dev": riusa la base e decide namespace e personalizzazioni.
# Puoi creare altri overlay (es. overlays/prod) con repliche, risorse o
# configurazioni diverse senza toccare la base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football

resources:
  - ../../base

# Esempio: in dev una sola replica del frontend
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Esempio: sovrascrivere una chiave della ConfigMap-backend solo in questo ambiente
configMapGenerator:
  - name: config-backend
    behavior: merge
    literals:
      - LOG_LEVEL=debug
